<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de Jogos</title>
<style>
  :root {
    --bg: #0c0e13;
    --panel: #151922;
    --panel-2: #1c2230;
    --line: #2a3243;
    --text: #e9edf5;
    --muted: #8d97ab;
    --accent: #ff5a3c;
    --ok: #3ccf91;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
    background-image: radial-gradient(1200px 500px at 50% -150px, #1d2540 0%, transparent 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px 48px;
  }
  main { max-width: 1040px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 0; }
  .lan {
    display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line); font-size: .85rem; color: var(--muted);
  }
  .lan[hidden] { display: none; }
  .lan b { color: var(--ok); font-family: ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; color: inherit; text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-3px); border-color: var(--c, var(--accent));
    box-shadow: 0 10px 30px -10px var(--c, var(--accent)); outline: none;
  }
  .art { aspect-ratio: 16 / 9; display: block; width: 100%; background: var(--panel-2); }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 800; }
  .new { font-size: .7rem; font-weight: 800; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 99px; }
  .desc { color: var(--muted); font-size: .92rem; line-height: 1.4; margin: 0; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .75rem; padding: 2px 9px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .play { margin-top: 4px; font-weight: 800; color: var(--c, var(--accent)); }
  .card.off { opacity: .55; }
  .card.off .play { color: var(--muted); font-weight: 600; font-size: .85rem; }
  code { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; font-size: .85em; }
  footer { margin-top: 32px; color: var(--muted); font-size: .85rem; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sala de <span>Jogos</span></h1>
    <p class="sub">Escolha um jogo. Mais coisa vem por aí.</p>
    <div class="lan" id="lan" hidden></div>
  </header>
  <section class="grid" id="grid"></section>
  <footer>
    Jogos online precisam do servidor: na pasta <code>games</code>, rode <code>node server.js</code>
    e abra o endereço que aparecer no terminal.
  </footer>
</main>

<script>
// ─── Registro de jogos ───────────────────────────────────────────────
// Para adicionar um jogo: crie a pasta (ou o .html) e adicione uma entrada aqui.
//   href:   caminho relativo a esta página
//   online: true se precisa do server.js (fica desativado quando aberto como arquivo)
const JOGOS = [
  {
    nome: "Ofensiva",
    href: "ofensiva/",
    desc: "Tiro tático em 3D, em primeira pessoa: Rebeldes contra Tática com loja, bomba e rodadas. Modos Desarmar, Mata-mata e Corrida armada, com bots.",
    tags: ["FPS 3D", "1–16 jogadores", "Bots", "Rede local"],
    cor: "#e8a23a",
    online: true,
    novo: true,
    arte: "ofensiva",
  },
  {
    nome: "Tiro & Treta Online",
    href: "tiro-e-treta/online/",
    desc: "Briga de plataforma com armas: pegue o que cair do céu, exploda barris e seja o último de pé. Cada um no seu PC ou celular pela rede Wi-Fi, até 4 jogadores + bots.",
    tags: ["Ação", "2–4 jogadores", "Rede local", "Celular"],
    cor: "#ff8a3c",
    online: true,
    novo: true,
    arte: "tiro-online",
  },
  {
    nome: "Batalha Minada Online",
    href: "batalha-online/",
    desc: "Batalha naval com dicas de campo minado: cada tiro na água conta quantos navios estão ao redor. Cada jogador no seu celular ou PC, pela rede Wi-Fi.",
    tags: ["Estratégia", "2 jogadores", "Rede local"],
    cor: "#3ccf91",
    online: true,
    arte: "naval-online",
  },
];

const ARTE = {

    <path d="M96 82h128v-46H96z" fill="#e0c9a0"/><path d="M140 82h40V50h-40z" fill="#3b3226"/>

    <g><path d="M232 92h34v26h-34z" fill="#9c6a35"/><path d="M232 92l34 26M266 92l-34 26" stroke="#6e4620" stroke-width="3"/><path d="M232 92h34v26h-34z" fill="none" stroke="#6e4620" stroke-width="3"/></g>
    <g transform="translate(158 80)"><rect x="-6" y="-22" width="12" height="16" fill="#3a4c6e"/><rect x="-5" y="-30" width="10" height="9" fill="#e2b48a"/><rect x="-6" y="-32" width="12" height="4" fill="#1d2636"/>
      <path d="M-4 -6v8M4 -6v8" stroke="#22283a" stroke-width="4"/></g>
    <path d="M180 180l18-52h22l-8 18h-8l-6 34z" fill="#1c1c20"/><path d="M196 132l52-12 4 10-54 12z" fill="#2a2a30"/>
    <path d="M200 140l-10 40h26l6-24z" fill="#c9a27a"/>
    <g stroke="#58ff86" stroke-width="2"><path d="M160 86v-6M160 96v6M150 91h-6M170 91h6"/></g>
    <text x="16" y="34" font-family="system-ui,sans-serif" font-weight="900" font-size="22" fill="#fff" opacity=".9">A</text>
  </svg>`,

    <rect x="96" y="112" width="22" height="28" fill="#c22f2f" stroke="#111" stroke-width="2"/><rect x="96" y="120" width="22" height="4" fill="#ffd24b"/>
    <g stroke="#111" stroke-width="2"><rect x="200" y="100" width="26" height="28" fill="#a8743f"/><path d="M200 100l26 28M226 100l-26 28"/></g>
    <g transform="translate(60 140)"><path d="M-4 0l4-16 4 16" stroke="#3a2a2a" stroke-width="5" stroke-linecap="round" fill="none"/>
      <rect x="-6" y="-32" width="12" height="17" fill="#e5484d" stroke="#111" stroke-width="2"/><rect x="-6" y="-44" width="12" height="12" fill="#f1c39b" stroke="#111" stroke-width="2"/>
      <rect x="2" y="-31" width="18" height="5" fill="#333" stroke="#111"/></g>
    <g transform="translate(262 128) scale(-1 1)"><path d="M-5 0l5-16 5 16" stroke="#22304a" stroke-width="5" stroke-linecap="round" fill="none"/>
      <rect x="-6" y="-32" width="12" height="17" fill="#3e8cff" stroke="#111" stroke-width="2"/><rect x="-6" y="-44" width="12" height="12" fill="#e8b48a" stroke="#111" stroke-width="2"/>
      <rect x="2" y="-31" width="12" height="5" fill="#333" stroke="#111"/></g>
    <path d="M84 111h70" stroke="#ffd27a" stroke-width="2.5" stroke-linecap="round"/><path d="M160 109h40" stroke="#ffd27a" stroke-width="2" opacity=".5" stroke-linecap="round"/>
    <circle cx="82" cy="111" r="5" fill="#fff3c4"/>
  </svg>`,
  "tiro-online": `<svg class="art" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d3d"/><stop offset="1" stop-color="#7a3550"/></linearGradient></defs>

    <g fill="none" stroke="#ffb03c" stroke-width="3" stroke-linecap="round" opacity=".85">

    <g stroke="#a9b8c9" stroke-width="2"><rect x="26" y="78" width="104" height="66" rx="8" fill="#151922"/><rect x="190" y="70" width="104" height="80" rx="8" fill="#151922"/></g>
    <rect x="34" y="86" width="88" height="50" fill="#3a2450"/><rect x="198" y="78" width="88" height="64" fill="#3a2450"/>
    <rect x="34" y="122" width="88" height="14" fill="#2b2f3a"/><rect x="198" y="126" width="88" height="16" fill="#2b2f3a"/>
    <g transform="translate(58 122)"><rect x="-3" y="-17" width="6" height="9" fill="#e5484d"/><rect x="-3" y="-23" width="6" height="6" fill="#f1c39b"/><rect x="2" y="-16" width="8" height="2.5" fill="#222"/></g>
    <g transform="translate(262 126) scale(-1 1)"><rect x="-3" y="-17" width="6" height="9" fill="#3e8cff"/><rect x="-3" y="-23" width="6" height="6" fill="#e8b48a"/><rect x="2" y="-16" width="8" height="2.5" fill="#222"/></g>
    <path d="M70 107h30" stroke="#ffd27a" stroke-width="2" stroke-linecap="round"/><path d="M220 111h-24" stroke="#ffd27a" stroke-width="2" stroke-linecap="round"/>
    <rect x="70" y="144" width="16" height="4" fill="#a9b8c9"/><rect x="234" y="150" width="16" height="4" fill="#a9b8c9"/>
  </svg>`,
  naval: `<svg class="art" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="180" fill="#0e2236"/>
    <g fill="#16385c">${Array.from({ length: 50 }, (_, i) => `<rect x="${40 + (i % 10) * 24}" y="${30 + Math.floor(i / 10) * 24}" width="21" height="21" rx="3"/>`).join("")}</g>
    <rect x="88" y="54" width="93" height="21" rx="6" fill="#7d8fa3" stroke="#a9b8c9" stroke-width="2"/>
    <rect x="232" y="78" width="21" height="45" rx="6" fill="#7d8fa3" stroke="#a9b8c9" stroke-width="2"/>
    <rect x="136" y="54" width="21" height="21" rx="3" fill="#e5484d"/><text x="146.5" y="70" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">✕</text>
    <g font-family="system-ui" font-weight="800" font-size="13" text-anchor="middle">
      <text x="74.5" y="115" fill="#5fb4ff">1</text><text x="122.5" y="91" fill="#3ccf91">2</text><text x="218.5" y="139" fill="#ff7b72">3</text></g>
  </svg>`,
  "naval-online": `<svg class="art" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="180" fill="#0d2420"/>
    <g fill="none" stroke="#3ccf91" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M140 70a28 28 0 0 1 40 0"/><path d="M128 58a45 45 0 0 1 64 0"/><circle cx="160" cy="84" r="3" fill="#3ccf91"/></g>
    <g stroke="#a9b8c9" stroke-width="2"><rect x="48" y="60" width="56" height="96" rx="9" fill="#16385c"/><rect x="216" y="60" width="56" height="96" rx="9" fill="#16385c"/></g>
    <g fill="#1f4c7a">${Array.from({ length: 16 }, (_, i) => `<rect x="${55 + (i % 4) * 11}" y="${80 + Math.floor(i / 4) * 11}" width="9" height="9" rx="1.5"/>`).join("")}
      ${Array.from({ length: 16 }, (_, i) => `<rect x="${223 + (i % 4) * 11}" y="${80 + Math.floor(i / 4) * 11}" width="9" height="9" rx="1.5"/>`).join("")}</g>
    <rect x="66" y="91" width="20" height="9" rx="2" fill="#7d8fa3"/><rect x="245" y="102" width="9" height="20" rx="2" fill="#e5484d"/>

};

const arquivo = location.protocol === "file:";
const grid = document.getElementById("grid");
for (const j of JOGOS) {
  const off = j.online && arquivo;
  const el = document.createElement(off ? "div" : "a");
  el.className = "card" + (off ? " off" : "");
  el.style.setProperty("--c", j.cor);
  if (!off) el.href = j.href;
  el.innerHTML = `${ARTE[j.arte] || `<div class="art"></div>`}
    <div class="body">
      <div class="title">${j.nome}${j.novo ? `<span class="new">NOVO</span>` : ""}</div>
      <p class="desc">${j.desc}</p>
      <div class="tags">${j.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <div class="play">${off ? "Precisa do servidor: rode <code>node server.js</code>" : "Jogar →"}</div>
    </div>`;
  grid.append(el);
}

if (!arquivo) {
  fetch("api/info").then(r => r.json()).then(({ addresses }) => {
    if (!addresses?.length) return;
    const lan = document.getElementById("lan");
    lan.innerHTML = `Outros aparelhos na rede: ${addresses.map(a => `<b>${a}</b>`).join(" · ")}`;
    lan.hidden = false;
  }).catch(() => {});
}
</script>
</body>
</html>
